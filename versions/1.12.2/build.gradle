plugins { id 'java'; id 'xyz.wagyourtail.unimined' version '1.4.1' }
ext.minecraftTarget = '1.12.2'
apply from: '../../build-logic/legacy.gradle'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach { options.release = 8 }
unimined.minecraft {
    version '1.12.2'
    mappings { mcp('stable', '39-1.12') }
    runs {
        config('client') { javaVersion = JavaVersion.VERSION_1_8 }
        config('server') { javaVersion = JavaVersion.VERSION_1_8 }
    }
    minecraftForge { loader '14.23.5.2859' }
    // Runtime JEI is a production SRG artifact; map it for the native development client.
    mods { remap(configurations.runtimeOnly) }
}
repositories {
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://maven.blamejared.com' }
}
dependencies {
    implementation('zone.rong:mixinbooter:11.18') { transitive = false }
    annotationProcessor 'zone.rong:mixinbooter:11.18'
    compileOnly 'mezz.jei:jei_1.12.2:4.16.1.302:api'
    runtimeOnly 'mezz.jei:jei_1.12.2:4.16.1.302'
}
// Explicit mappings for the native Mixin boundaries.
def mixinSrg = layout.buildDirectory.file('generated/mapping/activity.srg')
def mixinRefmap = layout.buildDirectory.file('generated/mixinResources/mixins.farmersdelight.refmap.json')
tasks.register('generateMixinMapping') {
    outputs.file mixinSrg
    doLast {
        def target = mixinSrg.get().asFile
        target.parentFile.mkdirs()
        target.text = 'MD: net/minecraft/entity/player/EntityPlayer/addExhaustion (F)V net/minecraft/entity/player/EntityPlayer/func_71020_j (F)V\n'
        target << 'MD: net/minecraft/entity/passive/EntityPig/<init> (Lnet/minecraft/world/World;)V net/minecraft/entity/passive/EntityPig/<init> (Lnet/minecraft/world/World;)V\n'
        target << 'MD: net/minecraft/entity/passive/EntityChicken/<init> (Lnet/minecraft/world/World;)V net/minecraft/entity/passive/EntityChicken/<init> (Lnet/minecraft/world/World;)V\n'
        target << 'MD: net/minecraft/entity/passive/EntityPig/isBreedingItem (Lnet/minecraft/item/ItemStack;)Z net/minecraft/entity/passive/EntityPig/func_70877_b (Lnet/minecraft/item/ItemStack;)Z\n'
        target << 'MD: net/minecraft/entity/passive/EntityChicken/isBreedingItem (Lnet/minecraft/item/ItemStack;)Z net/minecraft/entity/passive/EntityChicken/func_70877_b (Lnet/minecraft/item/ItemStack;)Z\n'
        target << 'MD: net/minecraft/item/ItemSoup/onItemUseFinish (Lnet/minecraft/item/ItemStack;Lnet/minecraft/world/World;Lnet/minecraft/entity/EntityLivingBase;)Lnet/minecraft/item/ItemStack; net/minecraft/item/ItemSoup/func_77654_b (Lnet/minecraft/item/ItemStack;Lnet/minecraft/world/World;Lnet/minecraft/entity/EntityLivingBase;)Lnet/minecraft/item/ItemStack;\n'
        target << 'MD: net/minecraft/entity/EntityLivingBase/knockBack (Lnet/minecraft/entity/Entity;FDD)V net/minecraft/entity/EntityLivingBase/func_70653_a (Lnet/minecraft/entity/Entity;FDD)V\n'
        target << 'MD: net/minecraft/enchantment/Enchantment/canApply (Lnet/minecraft/item/ItemStack;)Z net/minecraft/enchantment/Enchantment/func_92089_a (Lnet/minecraft/item/ItemStack;)Z\n'
        target << 'MD: net/minecraft/block/BlockMushroom/canBlockStay (Lnet/minecraft/world/World;Lnet/minecraft/util/math/BlockPos;Lnet/minecraft/block/state/IBlockState;)Z net/minecraft/block/BlockMushroom/func_180671_f (Lnet/minecraft/world/World;Lnet/minecraft/util/math/BlockPos;Lnet/minecraft/block/state/IBlockState;)Z\n'
        mixinRefmap.get().asFile.parentFile.mkdirs()
    }
}
compileJava {
    dependsOn 'generateMixinMapping'
    inputs.file mixinSrg
    outputs.file mixinRefmap
    options.compilerArgs += ["-AreobfSrgFile=${mixinSrg.get().asFile}", "-AoutRefMapFile=${mixinRefmap.get().asFile}"]
}
processResources { dependsOn compileJava; from(mixinRefmap) }
jar { manifest { attributes 'MixinConfigs': 'mixins.farmersdelight.json' } }
jar.finalizedBy 'remapJar'
