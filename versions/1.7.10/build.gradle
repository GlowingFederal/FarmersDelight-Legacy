plugins { id 'com.gtnewhorizons.gtnhconvention' }
ext.minecraftTarget = '1.7.10'
apply from: '../../build-logic/legacy.gradle'
repositories {
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
    maven { url = 'https://maven.covers1624.net' }
}
dependencies {
    compileOnly('codechicken:NotEnoughItems:1.7.10-1.0.5.120:dev') { transitive = false }
    compileOnly('codechicken:CodeChickenLib:1.7.10-1.1.3.140:dev') { transitive = false }
}
// GTNH's UniMixins convention registers the static MixinConfigs manifest entry.
// Register it once; a second early loader would compete with that configuration.
jar.finalizedBy 'reobfJar'

// Optional scripting API; no scripting classes are bundled or required at runtime.
repositories { maven { url = 'https://maven.blamejared.com' } }
dependencies { compileOnly 'MineTweaker3:MineTweaker3-MC1710-Main:1.7.10-3.0.13.43' }
