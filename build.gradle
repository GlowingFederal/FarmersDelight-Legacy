plugins { id 'base' }
// Native wrappers keep Forge plugins and daemons isolated.
def targets = ['1.12.2': 21, '1.7.10': 25]
def builds = targets.collect { mc, jdk ->
    tasks.register('build' + mc.replace('.', '_'), Exec) {
        group = 'build'
        workingDir rootDir
        if (System.getProperty('os.name').toLowerCase().contains('windows')) commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
                file('scripts/run-gradle.ps1'), '-ProjectDirectory', file("versions/${mc}"),
                '-JavaVersion', jdk.toString(), *(jdk == 25 ? ['-EnableNativeAccess'] : []), 'build'
        else commandLine 'sh', file("versions/${mc}/gradlew"), 'build'
    }
}
builds[1].configure { mustRunAfter builds[0] }
tasks.register('buildAll') {
    group = 'build'
    dependsOn builds
    doLast {
        targets.keySet().each { mc ->
            def artifacts = fileTree("versions/${mc}/build/libs").matching { include "farmersdelight-*+mc${mc}-forge.jar" }.files
            if (artifacts.empty) throw new GradleException("Missing production artifact for ${mc}")
            artifacts.each { artifact ->
                def zip = new java.util.zip.ZipFile(artifact)
                try {
                    ['mcmod.info', 'farmersdelight/foods.json', 'vectorwing/farmersdelight/legacy/Foundation.class',
                     'vectorwing/farmersdelight/legacy/api/EffectRules.class'].each { entry ->
                        if (!zip.getEntry(entry)) throw new GradleException("${artifact}: missing ${entry}")
                    }
                } finally { zip.close() }
            }
        }
    }
}
tasks.named('build') { dependsOn 'buildAll' }
